[build]
  command = "cd client && npm install && npm run build && cd ../server && npm install"
  publish = "client/dist"
  functions = "server/functions"

[build.environment]
  VITE_API_URL = ""

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200